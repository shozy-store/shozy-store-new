<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>شوزي | محل الأحذية النسائية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--gold:#e6c65a;--gold2:#a8801f;--ink:#0b0b0b;--wood:#1a1410;--red:#c81d1d;--txt:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:dark;scroll-behavior:smooth}
body{font-family:'Cairo','DejaVu Sans',Tahoma,sans-serif;background:radial-gradient(ellipse at 50% 0,#2b2210,#0b0b0b 60%);color:var(--txt);min-height:100%;padding-bottom:110px}
.goldtxt{background:linear-gradient(90deg,#b8902a,#f6e27a,#c9a227);-webkit-background-clip:text;background-clip:text;color:transparent}
.awning{height:46px;background:repeating-linear-gradient(90deg,#111 0 34px,#c9a227 34px 68px);position:relative;margin-top:10px;box-shadow:0 6px 18px #000}
.awning::after{content:"";position:absolute;left:0;right:0;top:100%;height:18px;background:radial-gradient(circle at 17px 0,#111 16px,transparent 17px) 0 0/68px 18px repeat-x,radial-gradient(circle at 51px 0,#c9a227 16px,transparent 17px) 0 0/68px 18px repeat-x}
.sign{margin:34px auto 0;width:min(92%,560px);text-align:center;padding:18px 16px 16px;border:3px solid var(--gold);border-radius:22px;background:linear-gradient(180deg,#171208,#050505);box-shadow:0 0 34px rgba(230,198,90,.35)}
.sign img{width:150px;height:150px;border-radius:50%;border:4px solid var(--gold);box-shadow:0 0 28px rgba(230,198,90,.6);object-fit:cover;transform:none}
.sign h1{font-size:30px;font-weight:800;margin-top:8px}
.sign p{font-size:15px;opacity:.9;margin-top:2px}
.open{display:inline-block;margin-top:10px;padding:4px 16px;border-radius:20px;background:var(--red);font-size:14px;font-weight:800;box-shadow:0 0 14px rgba(200,29,29,.7)}
.window{margin:26px auto 0;width:min(96%,1100px);padding:14px 10px 24px;border:4px solid var(--gold);border-radius:18px;background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.01) 40%),#0d0a06;box-shadow:inset 0 0 40px #000,0 0 30px rgba(230,198,90,.2)}
.plate{display:flex;align-items:baseline;gap:10px;padding:10px 12px 4px}
.plate h2{font-size:24px;font-weight:800}.plate span{font-size:14px;opacity:.8}
.row{display:flex;gap:14px;overflow-x:auto;padding:6px 12px 0;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.row::-webkit-scrollbar{display:none}
.card{flex:0 0 min(62vw,250px);scroll-snap-align:start;background:#14100a;border:2px solid #3a2f14;border-radius:14px;overflow:hidden;text-align:center}
.card img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:#222}
.card b{display:block;padding:8px 0 2px;font-size:17px}
.card .b{margin:6px 10px 12px;display:flex;align-items:center;justify-content:center;gap:6px;height:42px;border-radius:24px;background:linear-gradient(180deg,#25d366,#128c4a);color:#fff;text-decoration:none;font-weight:800;font-size:15px}
.board{height:16px;margin:0 4px 26px;border-radius:4px;background:linear-gradient(180deg,#e6c65a,#7a5c14 60%,#2a1f08);box-shadow:0 10px 16px #000}
.info{margin:26px auto 0;width:min(92%,560px);display:grid;gap:10px;text-align:center}
.info div{border:2px solid #3a2f14;border-radius:14px;padding:12px;background:#100c06;font-weight:600}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(92%,420px);height:60px;border-radius:32px;background:linear-gradient(180deg,#25d366,#0f7a3f);color:#fff;border:3px solid var(--gold);display:flex;align-items:center;justify-content:center;gap:10px;font-size:20px;font-weight:800;text-decoration:none;box-shadow:0 0 26px rgba(37,211,102,.55),0 8px 20px #000;z-index:9}
svg.wa{width:26px;height:26px;fill:#fff;flex:none}
</style></head><body>
